<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </radialGradient>
    <linearGradient id="stone-grad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#6c6c88"/>
      <stop offset="40%" stop-color="#45455e"/>
      <stop offset="100%" stop-color="#22222f"/>
    </linearGradient>
    <radialGradient id="contact-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ff6600" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="spark-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#2e2e42" stroke-width="1.5"/>

  <!-- Subtle background glow at strike point only -->
  <circle cx="144" cy="126" r="38" fill="url(#contact-glow)" opacity="0.5"/>

  <!-- Flint stone body -->
  <polygon
    points="68,162  82,104  116,82  160,88  186,114  180,158  150,178  96,174"
    fill="url(#stone-grad)"
  />

  <!-- Top-left bright facet -->
  <polygon
    points="82,104  116,82  132,98  98,114"
    fill="#7a7a96" opacity="0.75"
  />

  <!-- Bottom-right shadow facet -->
  <polygon
    points="150,178  180,158  172,168"
    fill="#111120" opacity="0.55"
  />

  <!-- Edge highlight line -->
  <polyline
    points="98,114  132,98  160,88"
    fill="none" stroke="#9898b8" stroke-width="1" opacity="0.45"
  />

  <!-- Strike contact bright spot -->
  <circle cx="144" cy="126" r="5" fill="#ffcc00" opacity="0.9" filter="url(#soft)"/>
  <circle cx="144" cy="126" r="2.5" fill="#ffffff" opacity="1"/>

  <!-- Sparks (radiate up-right from contact point) -->
  <g filter="url(#spark-glow)">
    <line x1="144" y1="124" x2="172" y2="72"  stroke="#ffcc00" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="145" y1="123" x2="194" y2="80"  stroke="#ff9800" stroke-width="2"   stroke-linecap="round"/>
    <line x1="143" y1="122" x2="164" y2="64"  stroke="#ffe57f" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="146" y1="124" x2="202" y2="96"  stroke="#ff6f00" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="143" y1="121" x2="156" y2="68"  stroke="#fff8e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="145" y1="125" x2="178" y2="90"  stroke="#ffb300" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Spark tips glowing dots -->
  <circle cx="172" cy="72"  r="3.5" fill="#fff9c4" filter="url(#soft)"/>
  <circle cx="194" cy="80"  r="2.8" fill="#ffe082" filter="url(#soft)"/>
  <circle cx="164" cy="64"  r="2.5" fill="#ffffff"  filter="url(#soft)"/>
  <circle cx="202" cy="96"  r="2.2" fill="#ffb300"  filter="url(#soft)"/>
  <circle cx="156" cy="68"  r="1.8" fill="#ffffff"  filter="url(#soft)"/>
  <circle cx="178" cy="90"  r="2"   fill="#ffe57f"  filter="url(#soft)"/>

  <!-- Tiny flying embers -->
  <circle cx="185" cy="58"  r="1.5" fill="#ffca28" opacity="0.9"/>
  <circle cx="196" cy="67"  r="1.1" fill="#ff9800" opacity="0.75"/>
  <circle cx="168" cy="54"  r="1.3" fill="#ffe57f" opacity="0.85"/>
  <circle cx="208" cy="88"  r="1"   fill="#ffab00" opacity="0.7"/>
  <circle cx="162" cy="78"  r="0.9" fill="#fff8e1" opacity="0.8"/>
  <circle cx="188" cy="100" r="1.1" fill="#ff8f00" opacity="0.65"/>
</svg>
